name: iOS · App Store

on:
  push:
    tags: ["ios-*"]
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit for App Review after upload"
        type: boolean
        default: true
      submit_only:
        description: "Skip the build and only submit an already uploaded build number"
        type: string
        default: ""

concurrency: { group: ios-release, cancel-in-progress: false }

env:
  BUNDLE_ID: com.shneitzdadim.app
  APP_VERSION: "1.0"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 120
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -z "$K" ] && missing="$missing ASC_KEY_ID"
          [ -z "$I" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: API key
        env: { P8: "${{ secrets.ASC_KEY_P8 }}" }
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$P8" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" >> $GITHUB_ENV
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" || python3 -m pip install --quiet "pyjwt[crypto]"

      - name: Team ID
        if: inputs.submit_only == ''
        env: { ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}", ASC_ISSUER_ID: "${{ secrets.ASC_ISSUER_ID }}", TEAM: "${{ secrets.APPLE_TEAM_ID }}" }
        run: |
          if [ -z "$TEAM" ]; then TEAM=$(python3 scripts/asc.py team); fi
          echo "Team: $TEAM"
          echo "TEAM_ID=$TEAM" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        if: inputs.submit_only == ''
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }

      - name: Web app → native shell
        if: inputs.submit_only == ''
        run: |
          npm ci
          SITE_DIR=.. node scripts/sync-web.mjs
          npx cap sync ios

      - name: Archive
        if: inputs.submit_only == ''
        run: |
          xcodebuild -version
          BUILD_NUM=$(date -u +%Y%m%d%H%M)
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E '(error|warning: .*(sign|profile|certificate))|ARCHIVE (SUCCEEDED|FAILED)' || true
          grep -q 'ARCHIVE SUCCEEDED' "$RUNNER_TEMP/archive.log" || { tail -n 80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect
        if: inputs.submit_only == ''
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 40
          grep -qE 'EXPORT SUCCEEDED|Upload succeeded|Uploaded' "$RUNNER_TEMP/export.log" || { echo "::error::Upload failed, see log above"; exit 1; }
          echo "### Uploaded $APP_VERSION ($BUILD_NUM)" >> $GITHUB_STEP_SUMMARY

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: xcode-logs, path: "${{ runner.temp }}/*.log", if-no-files-found: ignore }

      - name: Submit for App Review
        if: inputs.submit != false || inputs.submit_only != ''
        env: { ASC_KEY_ID: "${{ secrets.ASC_KEY_ID }}", ASC_ISSUER_ID: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          N="${{ inputs.submit_only }}"; [ -z "$N" ] && N="$BUILD_NUM"
          python3 scripts/asc.py submit "$N" | tee -a $GITHUB_STEP_SUMMARY
