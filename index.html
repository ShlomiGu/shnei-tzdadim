<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שני צדדים</title>
<meta name="description" content="אפליקציית יום החתונה לחבורת החתן וחבורת הכלה: אלבומים נפרדים, טיזרים, חשיפה בחופה, לו״ז ומשימות.">
<meta property="og:title" content="שני צדדים · יום החתונה">
<meta property="og:description" content="קיבלתם קוד? הצטרפו לחבורה, צלמו בשקט, והכל נחשף בחופה.">
<meta property="og:image" content="https://shlomigu.github.io/shnei-tzdadim/og.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F6F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140F16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="שני צדדים">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column — translucent sticky header, cards on a warm-lilac ground, fixed tab bar with a raised camera button.
   Each side has its own colour (groom = deep teal, bride = rose); shared moments are antique gold. */
:root{
  --bg:#F6F2F4; --surface:#FFFFFF; --surface-2:#EFE8EC; --ink:#241821; --muted:#776A73; --line:#E6DDE2;
  --gold:#9A7426; --gold-soft:#F4EAD4; --gold-ink:#5F4512;
  --groom:#22686C; --groom-soft:#DCEDEC; --bride:#B2486A; --bride-soft:#F8E1E8;
  --veil:#EDE5EA; --lace:#D9CDD4; --ok:#2E7D4F; --ok-soft:#DDF0E3; --scrim:rgb(20 12 18 / .55); --glass:rgb(246 242 244 / .82);
  --shadow:0 1px 2px rgb(36 24 33 / .05), 0 8px 24px rgb(36 24 33 / .07);
  --f-display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --f-body:"Rubik","Assistant","Arial Hebrew",system-ui,-apple-system,sans-serif;
  --r:22px; --r-s:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#140F16; --surface:#1E1720; --surface-2:#281F2B; --ink:#F3ECF1; --muted:#A99BA6; --line:#352A37;
  --gold:#D9B568; --gold-soft:#3A2F19; --gold-ink:#F1DCA8;
  --groom:#7CC6C1; --groom-soft:#163234; --bride:#F09DB6; --bride-soft:#3B1C27;
  --veil:#231A26; --lace:#3A2D3D; --ok:#7FD3A0; --ok-soft:#173326; --scrim:rgb(0 0 0 / .62); --glass:rgb(20 15 22 / .82);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .28);
  color-scheme:dark } }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.ic{display:block;flex:none}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:500}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display)}

#app{max-width:560px;margin:0 auto;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#app.bare{padding-bottom:24px}
#app[data-side="groom"]{--me:var(--groom);--me-soft:var(--groom-soft);--them:var(--bride);--them-soft:var(--bride-soft)}
#app[data-side="bride"]{--me:var(--bride);--me-soft:var(--bride-soft);--them:var(--groom);--them-soft:var(--groom-soft)}
#app:not([data-side]){--me:var(--ink);--me-soft:var(--surface-2);--them:var(--gold);--them-soft:var(--gold-soft)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:6px;padding:10px 0;
  background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand-mark{width:36px;height:22px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:500;font-size:23px;line-height:1;white-space:nowrap}
.side-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--me-soft);color:var(--me);white-space:nowrap}
.side-pill i{width:7px;height:7px;border-radius:50%;background:var(--me)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--surface-2)}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabs-in.four{grid-template-columns:repeat(4,1fr)}
#app[data-side="guest"]{--me:var(--gold);--me-soft:var(--gold-soft);--them:var(--bride);--them-soft:var(--bride-soft)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] .ic{color:var(--me)}
.tab .badge{position:absolute;top:5px;left:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--them);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.fab-slot{display:flex;flex-direction:column;align-items:center;padding-bottom:7px}
.fab{width:58px;height:58px;border-radius:50%;margin-top:-24px;display:grid;place-items:center;color:#fff;background:var(--me);
  box-shadow:0 10px 22px color-mix(in srgb,var(--me) 40%,transparent),0 0 0 5px var(--bg);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab-label{font-size:11.5px;font-weight:600;color:var(--me);margin-top:4px}

/* generic */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-t{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.15}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.link{font-size:14px;font-weight:600;color:var(--me);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.45}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.page-t{font-family:var(--f-display);font-weight:500;font-size:34px;line-height:1.05}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;background:var(--me);color:#fff;transition:transform .12s,opacity .12s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btn.danger{background:transparent;color:var(--bride);box-shadow:inset 0 0 0 1.5px currentColor}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:9px 8px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{font-family:var(--f-display);font-size:24px;color:var(--ink);margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:50px;padding:10px 14px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--me)}
textarea.input{min-height:100px;resize:vertical;line-height:1.5}
input[type="date"].input,input[type="time"].input{text-align:right}
.row{display:flex;gap:10px;align-items:center}
.row > *{min-width:0}
.grow{flex:1}
.av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.groom{background:var(--groom-soft);color:var(--groom)}
.tag.bride{background:var(--bride-soft);color:var(--bride)}
.tag.all{background:var(--gold-soft);color:var(--gold-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-s);background:var(--gold-soft);color:var(--gold-ink);font-size:14px;font-weight:500}

/* hero */
.hero{text-align:center;padding:8px 0 4px}
.hero-date{font-size:14px;font-weight:500;color:var(--muted)}
.names{font-family:var(--f-display);font-weight:500;font-size:clamp(42px,12.5vw,62px);line-height:1.02;margin-top:4px;display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 .2em}
.names .amp{font-size:.6em;color:var(--gold);font-weight:400}
.rings{width:min(220px,62%);height:auto;margin:4px auto 0;display:block;overflow:visible}
.rings circle{fill:none;stroke-width:5;transition:cx 1.4s cubic-bezier(.3,.7,.2,1)}
.rings .rg{stroke:var(--groom)} .rings .rb{stroke:var(--bride)}
.rings .gem{fill:var(--gold);transition:transform 1.4s cubic-bezier(.3,.7,.2,1)}
.count{margin-top:2px}
.count-label{font-size:14px;font-weight:500;color:var(--muted)}
.count-num{font-family:var(--f-display);font-weight:500;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-you{margin-top:6px;font-size:14px;color:var(--muted)}
.hero-you b{color:var(--me);font-weight:600}

/* now / next */
.nn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nn > div{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r-s);padding:12px 14px;min-width:0}
.nn .k{font-size:12.5px;font-weight:600;color:var(--muted)}
.nn .t{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.nn .n{font-weight:500;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.nn .now{background:var(--me-soft);box-shadow:none}
.nn .now .k{color:var(--me)}

/* score */
.score{display:flex;flex-direction:column;gap:12px}
.score-row{display:grid;grid-template-columns:96px 1fr 46px;gap:10px;align-items:center}
.score-name{font-weight:600;font-size:14.5px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .8s cubic-bezier(.3,.7,.2,1)}
.score-pts{font-family:var(--f-display);font-weight:500;font-size:24px;text-align:left;font-variant-numeric:tabular-nums}
.lead{font-size:13.5px;color:var(--muted);text-align:center}

/* veil */
.lace{background-color:var(--veil);
  background-image:radial-gradient(circle,var(--lace) 1.5px,transparent 2.1px),radial-gradient(circle,transparent 5px,var(--lace) 5.5px,transparent 6.5px);
  background-size:14px 14px,28px 28px;background-position:0 0,7px 7px}
.veil-card{position:relative;border-radius:var(--r);overflow:hidden;padding:20px 18px;display:flex;gap:16px;align-items:center;text-align:start;width:100%}
.veil-card h3{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1.2}
.seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#FFF6E2;flex:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 70%,#fff),var(--gold) 55%,color-mix(in srgb,var(--gold) 72%,#000));
  box-shadow:0 3px 10px color-mix(in srgb,var(--gold) 38%,transparent)}

/* photos */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.strip::-webkit-scrollbar{display:none}
.strip .tile{width:96px;flex:none;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:18px;overflow:hidden}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface-2);display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .b{position:absolute;bottom:6px;right:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgb(0 0 0 / .45);color:#fff}
.tile .hc{position:absolute;bottom:6px;left:7px;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgb(0 0 0 / .5)}
.tile.blur img{filter:blur(10px) saturate(1.2);transform:scale(1.35)}
.tile .lockc{position:absolute;inset:0;display:grid;place-items:center;color:#fff;z-index:1}
.tile.veiled .lockc{color:var(--gold)}
.side-ribbon{position:absolute;top:7px;left:7px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px rgb(255 255 255 / .9)}
.album-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;top:14px;bottom:14px;right:63px;width:2px;background:var(--line);border-radius:1px}
.ti{display:grid;grid-template-columns:50px 28px minmax(0,1fr);align-items:start;padding:6px 0;text-align:start;width:100%}
.ti-time{font-family:var(--f-display);font-weight:500;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums;text-align:center;padding-top:9px}
.ti-dot{width:14px;height:14px;border-radius:50%;margin:13px auto 0;background:var(--bg);box-shadow:inset 0 0 0 3px var(--c,var(--gold));position:relative;z-index:1}
.ti.done .ti-dot{background:var(--c,var(--gold))}
.ti.reveal .ti-dot{width:20px;height:20px;margin-top:10px;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.ti-body{min-width:0;background:var(--surface);border-radius:var(--r-s);padding:10px 14px;box-shadow:var(--shadow);margin-inline-start:4px}
.ti.done .ti-body{opacity:.55}
.ti.current .ti-body{box-shadow:0 0 0 2px var(--me),var(--shadow)}
.ti-title{font-weight:600;font-size:16px;line-height:1.35;overflow-wrap:anywhere;display:block}
.ti-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:5px;font-size:13.5px;color:var(--muted)}
.ti-meta span{display:inline-flex;align-items:center;gap:4px}
.nowline{display:grid;grid-template-columns:50px 28px 1fr;align-items:center;font-size:12.5px;font-weight:600;color:var(--me);padding:4px 0}
.nowline span{text-align:center}
.nowline i{height:2px;background:var(--me);border-radius:1px}
.nowline b{width:10px;height:10px;border-radius:50%;background:var(--me);margin:auto;box-shadow:0 0 0 4px var(--me-soft);position:relative;z-index:1}
.contact{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0}
.contact .who{flex:1;min-width:0}
.contact .who b{display:block;font-size:15px;font-weight:600}
.contact .ph{font-size:14px;color:var(--muted);direction:ltr;unicode-bidi:isolate;user-select:all}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0;padding-top:2px}
.cbox{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line);color:transparent;transition:background .2s,color .2s}
.task.done .cbox{background:var(--me);box-shadow:none;color:#fff}
.task-body{flex:1;min-width:0}
.task-t{font-weight:500;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.task.done .task-t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.task-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.pts{font-weight:700;color:var(--gold-ink);background:var(--gold-soft);padding:2px 8px;border-radius:999px;font-size:12px}
.mission-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--me);background:var(--me-soft);padding:5px 11px;border-radius:999px}
.claim{font-size:13px;font-weight:600;color:var(--me)}
.edit-btn{color:var(--muted);padding:4px}

/* teasers */
.feed{display:flex;flex-direction:column;gap:12px}
.note{max-width:88%;border-radius:20px;padding:12px 14px;background:var(--surface);box-shadow:var(--shadow)}
.note.mine{align-self:flex-start;background:var(--me-soft);box-shadow:none;border-bottom-right-radius:6px}
.note.theirs{align-self:flex-end;border-bottom-left-radius:6px}
.note .from{font-size:12.5px;font-weight:600;margin-bottom:3px}
.note .txt{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
.note .when{font-size:12px;color:var(--muted);margin-top:6px}
.note .ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin-top:8px;border-radius:12px;overflow:hidden}
.note .ph.one{grid-template-columns:1fr}
.note .ph .tile{aspect-ratio:4/3}
.reacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.react{font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-weight:600}
.react[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink)}
.composer{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:0 -2px 30px rgb(0 0 0 / .08),var(--shadow);display:flex;flex-direction:column;gap:10px}
.composer .chips{margin-inline:-12px;padding-inline:12px}
.send{width:48px;height:48px;border-radius:50%;background:var(--me);color:#fff;display:grid;place-items:center;flex:none}
.attach{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;position:relative}

.song-meta{flex:1;min-width:0;text-align:start;display:flex;flex-direction:column;gap:1px}
.song-meta b{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-meta span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songs-empty{display:grid;place-items:center;padding:48px 0;color:var(--muted)}
.songs-foot{display:flex;gap:8px}
.songs-foot .btn{flex:1;gap:6px}
.songs-credit{text-align:center}
.song-card{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-align:start}
.song-card b{display:block;font-weight:600;font-size:15.5px}
.song-card .grow span{font-size:13px;color:var(--muted)}
.song-art{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--bride),var(--gold),var(--groom))}
.song-part{display:flex;flex-direction:column;gap:4px}
.song-part canvas{width:100%;height:56px;touch-action:none;cursor:grab;display:block}
.song-times{font-size:12.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.recap-pill{border:0;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
.recap-pill.low{top:calc(env(safe-area-inset-top,0px) + 112px)}
.upq-ring{width:22px;height:22px;border-radius:50%;flex:none;background:conic-gradient(var(--gold) calc(var(--p) * 1%),rgb(127 127 127 / .35) 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 7px);mask:radial-gradient(circle,transparent 6px,#000 7px)}
.offline{top:calc(env(safe-area-inset-top,0px) + 110px)}
.prev-v{display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;gap:2px;align-content:center}
/* ai */
.ai-card{background:linear-gradient(135deg,var(--gold-soft),var(--me-soft));border-radius:var(--r);padding:16px;margin-bottom:14px}
.ai-card b{font-weight:600}
.ai-card textarea.input{min-height:72px;background:var(--surface);border-color:transparent}
.ai-card textarea.input:focus{border-color:var(--me)}
.ai-badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;flex:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgb(255 255 255 / .35);border-top-color:#fff;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.diff{display:flex;flex-direction:column;gap:6px}
.diff-row{display:grid;grid-template-columns:auto 50px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 12px;border-radius:12px;background:var(--surface)}
.diff-row .dt{font-family:var(--f-display);font-weight:500;font-variant-numeric:tabular-nums}
.diff-row .dx{overflow-wrap:anywhere;font-size:15px}
.diff-row .was{display:block;font-size:12.5px;color:var(--muted);text-decoration:line-through}
.diff-row.del .dx{text-decoration:line-through;color:var(--muted)}
.dtag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.dtag.add{background:var(--ok-soft);color:var(--ok)} .dtag.chg{background:var(--gold-soft);color:var(--gold-ink)} .dtag.del{background:var(--bride-soft);color:var(--bride)}
/* venue picker */
.vp-row{position:relative}
.vp-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;background:var(--surface);border-radius:var(--r-s);box-shadow:0 14px 36px rgb(0 0 0 / .18),0 0 0 1px var(--line);max-height:330px;overflow-y:auto;overscroll-behavior:contain}
.vp-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:10px 14px;text-align:start;border-top:1px solid var(--line)}
.vp-item:first-child{border-top:0}
.vp-item:hover,.vp-item.on{background:var(--surface-2)}
.vp-n{font-weight:600;font-size:15px}
.vp-en{font-weight:400;color:var(--muted);font-size:13px;margin:0 8px;unicode-bidi:isolate}
.vp-c{font-size:12.5px;color:var(--muted)}
.vp-add{flex-direction:row;align-items:center;gap:8px;color:var(--me);font-weight:600;font-size:14px}
.venue-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-s);background:var(--surface-2);margin-bottom:10px}
.waze{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:#33CCFF;color:#062A36;font-weight:700;font-size:13.5px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ============ recap video ============ */
// Beat-synced: every cut lands on the music. A photo lasts about 2–3 s, a clip up to ~5.5 s, always whole beats.
const photoBeats = beat => { const d = 4 * beat; return d > 3.4 ? 3 : d < 1.9 ? 6 : 4; };
const clipBeatsMax = beat => Math.max(photoBeats(beat), Math.floor(5.6 / beat / 2) * 2);

const RECAP_MAX = RECAP_LEN.full.items;

  if (ms(p.created_at) < recapRevealT() && (p.team === "groom" || p.team === "bride")) return p.team;
  return "together";
}
function spreadPick(list, n) {
  // n items spread evenly across the day; in each slice of time the most-loved one wins
  if (list.length <= n) return list.slice();
  const b = Array.from({ length: n }, () => []);
  list.forEach((p, i) => b[Math.floor(i * n / list.length)].push(p));
  return b.map(x => x.slice().sort((a, c) => (c.hearts || 0) - (a.hearts || 0))[0]).filter(Boolean);
}
function recapPick(len = "full") {
  const L = RECAP_LEN[len] || RECAP_LEN.full;
  const all = recapPool().slice().sort((a, b) => ms(a.created_at) - ms(b.created_at));
  const vids = all.filter(p => p.kind === "video" && (!p.duration || p.duration >= 2))
    .sort((a, b) => (b.hearts || 0) - (a.hearts || 0) || ms(b.created_at) - ms(a.created_at)).slice(0, L.vids);
  const photos = all.filter(p => p.kind !== "video");
  const room = Math.max(3, L.items - vids.length);
  // every chapter gets its fair share, and at least a few moments, so both sides are in the film
  const ch = { groom: [], bride: [], together: [] };
  photos.forEach(p => ch[recapChapter(p)].push(p));
  const keys = Object.keys(ch).filter(k => ch[k].length);
  const quota = {}; let left = room;
  keys.forEach(k => { quota[k] = Math.min(ch[k].length, 3); left -= quota[k]; });
  while (left > 0) {
    const k = keys.filter(k => quota[k] < ch[k].length).sort((a, b) => quota[a] / ch[a].length - quota[b] / ch[b].length)[0];
    if (!k) break; quota[k]++; left--;
  }
  const chosen = keys.flatMap(k => spreadPick(ch[k], quota[k])).concat(vids);
  const order = { groom: 0, bride: 1, together: 2 };
  return chosen.sort((a, b) => order[recapChapter(a)] - order[recapChapter(b)] || ms(a.created_at) - ms(b.created_at));
}

  for (let i = 0; i < pick.length; i++) {

  const add = s => { s.tb = tb; segs.push(s); tb += s.beats; };
  const toBar = () => { const r = tb % 4; if (r && segs.length) { segs[segs.length - 1].beats += 4 - r; tb += 4 - r; } };
  add({ kind: "intro", beats: 8 });
  let dropB = null;
  const chapLabel = { groom: `הצד של ${coupleName("groom")}`, bride: `הצד של ${coupleName("bride")}`, together: "ביחד" };
  const byCh = k => media.filter(m => recapChapter(m.p) === k);
  const best = list => list.filter(m => m.kind === "img").sort((a, b) => (b.p.hearts || 0) - (a.p.hearts || 0))[0];
  let chapIdx = 0;
  const multi = ["groom", "bride", "together"].filter(k => byCh(k).length).length > 1;
  for (const k of ["groom", "bride", "together"]) {

    if (k === "together") {

  }
  toBar();
  const outB = tb;
  if (dropB === null || dropB >= outB) dropB = Math.min(outB, 8 + 4 * Math.round((outB - 8) * .35 / 4));
  add({ kind: "outro", beats: 8 });
  segs.forEach(s => { s.t = s.tb * BEAT; s.dur = s.beats * BEAT; });
  const total = tb * BEAT + .6;
  const sec = { intro: 8 * BEAT, drop: dropB * BEAT, outro: outB * BEAT, total };

  // 3) drawing
  const cv = document.createElement("canvas"); cv.width = Wd; cv.height = Ht;
  const x = cv.getContext("2d", { alpha: false });
  const pvOf = () => { const c = ctl.preview || preview; return c && c.isConnected ? c : null; };
  x.imageSmoothingQuality = "high";
  await document.fonts.ready;
  const gold = "#C9A65A", groomC = "#2E7F83", brideC = "#C2557A";
  const names = `${coupleName("groom")} & ${coupleName("bride")}`;
  const dateStr = fmtDate(W().date);
  let coverIm = null; try { if (W().cover_thumb) coverIm = await loadForCanvas(pub(W().cover_thumb)); } catch {}
  const ease = v => v < 0 ? 0 : v > 1 ? 1 : v * v * (3 - 2 * v);
  const easeOut = v => v < 0 ? 0 : v > 1 ? 1 : 1 - Math.pow(1 - v, 3);
  const srcOf = m => m.kind === "vid" ? (m.v.readyState >= 2 ? m.v : m.im) : m.im;

    if (a <= 0) return;
    x.globalAlpha = a; x.fillStyle = color; x.textAlign = "center"; x.direction = "rtl";
    x.font = `${weight} ${size}px "${font}", serif`; x.shadowColor = "rgba(0,0,0,.4)"; x.shadowBlur = size * .3;
    x.fillText(txt, Wd / 2, y); x.shadowBlur = 0; x.globalAlpha = 1;
  };
  const chapterTag = (txt, a, rise) => {
    if (a <= 0) return;
    x.save(); x.globalAlpha = a; x.font = `500 50px "Rubik", sans-serif`; x.direction = "rtl"; x.textAlign = "center";
    const w = x.measureText(txt).width + 70, y = 250 - rise;
    x.fillStyle = "rgba(18,13,20,.55)"; x.beginPath(); x.roundRect ? x.roundRect((Wd - w) / 2, y - 52, w, 82, 41) : x.rect((Wd - w) / 2, y - 52, w, 82); x.fill();
    x.strokeStyle = gold; x.lineWidth = 2; x.stroke();
    x.fillStyle = "#F6EEF2"; x.fillText(txt, Wd / 2, y + 6); x.restore();
  };
  const bg = () => { const g = x.createLinearGradient(0, 0, 0, Ht); g.addColorStop(0, "#1D1520"); g.addColorStop(1, "#120D14"); x.fillStyle = g; x.fillRect(0, 0, Wd, Ht); };
  const drawSeg = (s, l, alpha) => {
    x.globalAlpha = alpha;
    if (s.kind === "img" || s.kind === "vid") {

      const zin = s.n % 2 === 0, z = s.kind === "vid" ? 1.0 + .03 * pr : zin ? 1.03 + .09 * pr : 1.12 - .09 * pr;
      const dir = s.n % 4 < 2 ? 1 : -1;
      place(s.m, 0, 0, Wd, Ht, z, s.kind === "vid" ? 0 : dir * 14 * l, s.kind === "vid" ? 0 : -9 * l);

      const a = easeOut(l / .9), b = easeOut((l - .25) / .9);

      x.save(); x.beginPath(); x.rect(0, Ht / 2 + 4, Wd, Ht / 2); x.clip(); place(s.b, -(1 - b) * Wd, Ht / 2, Wd, Ht / 2, 1.04 + .03 * l / s.dur, 0, 0); x.restore();

    x.fillStyle = "#120D14"; x.fillRect(0, 0, Wd, Ht);

    const g = x.createLinearGradient(0, Ht * .62, 0, Ht); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)"); x.fillStyle = g; x.fillRect(0, Ht * .62, Wd, Ht * .38);
    if (cur.m) {
      const a = ease((l - .3) / .5) * (1 - ease((l - cur.dur + .4) / .4));
      const cap = [cur.m.p.caption, nameOf(cur.m.p.member_id)].filter(Boolean).join(" · ");
      if (cap) title(cap, 46, Ht - 170 - 14 * ease((l - .3) / .5), "#fff", a, "Rubik", 400);
      if (cur.chapter) chapterTag(cur.chapter, ease((l - .15) / .45) * (1 - ease((l - 1.9) / .4)), 12 * ease((l - .15) / .45));
    }
    // intro: names over the first photo fading in
    const intro = segs[0];
    if (t < intro.dur + FADE) {
      const first = segs[1];
      if (first && t > intro.dur - 1.2) { x.globalAlpha = ease((t - intro.dur + 1.2) / 1.2) * .6; drawSeg(first, 0, ease((t - intro.dur + 1.2) / 1.2) * .6); x.globalAlpha = 1; }
      const a = 1 - ease((t - intro.dur + .2) / (FADE + .2));
      x.globalAlpha = a * (t < intro.dur - 1.2 ? 1 : 1 - .5 * ease((t - intro.dur + 1.2) / 1.2)); bg(); x.globalAlpha = 1;
      const ta = a * ease(t / .9);
      portrait(Wd / 2, Ht * .36 - 20 * (1 - easeOut(t / 1.4)), 178, ta);
      title(names, 128, Ht * .56, "#F6EEF2", ta);
      title(dateStr, 46, Ht * .62, gold, a * ease((t - .5) / .8), "Rubik", 400);
    }
    const out = segs[segs.length - 1];

      x.globalAlpha = a * .92; x.fillStyle = "#120D14"; x.fillRect(0, 0, Wd, Ht); x.globalAlpha = 1;
      portrait(Wd / 2, Ht * .4, 150, a);
      title(names, 112, Ht * .58, "#F6EEF2", a);
      title("שני צדדים · " + dateStr, 40, Ht * .64, gold, a * ease((t - out.t) / .8), "Rubik", 400);
      if (music.song && music.song.credit) title("♪ " + music.song.credit, 26, Ht - 120, "#B9A9B5", a * ease((t - out.t - .3) / .8), "Rubik", 400);

  ctl.onTotal && ctl.onTotal(total);

  }
  if (ac && ac.state !== "running") { try { await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 1500))]); } catch {} }

    } else if (inst) band = playScore(ac, duck, audioT0, music.score, sec, inst);

  if (!mime) throw new ApiError("too_big");

    held = media.filter(m => m.v && !m.v.paused); held.forEach(m => { try { m.v.pause(); } catch {} });
    try { ac && ac.suspend(); } catch {}
    try { wake && wake.release(); } catch {} wake = null;
    ctl.onPause && ctl.onPause();
  };

    if (!paused || document.hidden) return;
    if (ac) {
      try { await Promise.race([ac.resume(), new Promise(r => setTimeout(r, 1500))]); } catch {}

  return new File([new Blob(chunks, { type })], `${coupleName("groom")}-${coupleName("bride")}-סיכום.${type === "video/webm" ? "webm" : "mp4"}`.replace(/\s+/g, "_"), { type });
}

/* ============ slideshow (small option) ============ */
function slideshow() {
  const pool = () => (isGuest() ? guestFeed() : S.albumTab === "ours" ? S.st.photos.filter(p => p.team === mySide()) : S.albumTab === "other" ? S.st.photos.filter(p => p.team === otherSide() && p.mode === "full") : sharedList())
    .filter(p => p.mode === "full" && p.kind !== "video").slice().sort((a, b) => ms(b.created_at) - ms(a.created_at));
  if (!pool().length) return toast("אין עדיין תמונות למצגת", "album");
  const el = document.createElement("div"); el.className = "show"; el.dir = "rtl";
  el.innerHTML = `<img class="a"><img class="b"><div class="show-cap"></div><button class="icon-btn show-x" aria-label="סגירה">${ic("x")}</button>`;
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  try { el.requestFullscreen && el.requestFullscreen().catch(() => {}); } catch {}
  let wake = null; try { navigator.wakeLock && navigator.wakeLock.request("screen").then(w => wake = w, () => {}); } catch {}
  let i = 0, front = "a", seen = new Set(), timer = 0;
  const step = () => {
    const list = pool(); if (!list.length) return;
    const fresh = list.find(p => !seen.has(p.id));       // new photos jump the queue
    const p = fresh || list[i++ % list.length]; seen.add(p.id);
    const next = front === "a" ? "b" : "a", img = $("img." + next, el);
    img.onload = () => { img.classList.add("on"); $("img." + front, el).classList.remove("on"); front = next;
      $(".show-cap", el).textContent = [p.caption, nameOf(p.member_id)].filter(Boolean).join(" · "); };
    img.src = pub(p.path) || pub(p.thumb_path);
    timer = setTimeout(step, 6000);
  };
  const close = () => { clearTimeout(timer); el.remove(); document.body.style.overflow = ""; try { document.fullscreenElement && document.exitFullscreen(); } catch {} try { wake && wake.release(); } catch {} };
  $(".show-x", el).onclick = close; el.addEventListener("keydown", e => e.key === "Escape" && close());
  step();
}

/* ============ tiles ============ */
function tileHtml(p, opts = {}) {
  if (!p) return `<div class="tile veiled lace"><span class="lockc">${ic("lock", 22, 2)}</span></div>`;
  const full = p.mode === "full";
  const vb = p.team === mySide() && !isGuest() ? (p.vis === "teaser" ? "eye" : p.vis === "secret" ? "shield" : p.vis === "escorts" ? "friends" : "lock") : "";
  const blur = safeBlur(p.blur);
  const src = full ? pub(p.thumb_path) : blur;
  return `<button class="tile ${full ? "" : "blur"}" data-act="photo" data-id="${esc(p.id)}" aria-label="${esc(p.caption || (p.kind === "video" ? "סרטון" : "תמונה"))}"${full && blur ? ` style="background-image:url('${blur}')"` : ""}>
    ${src ? `<img src="${src}" alt="" loading="lazy" decoding="async">` : ""}
    ${!full ? `<span class="lockc">${ic("eye", 24, 2)}</span>` : ""}
    ${p.kind === "video" && full ? `<span class="vb">${ic("play", 11)}${p.duration ? fmtDur(p.duration) : ""}</span>` : ""}
    ${opts.ribbon ? `<span class="side-ribbon" style="background:${sideVar(p.team)}"></span>` : ""}
    ${vb && full && !opts.ribbon ? `<span class="b">${ic(vb, 14, 2)}</span>` : ""}
    ${p.hearts && full && !opts.more ? `<span class="hc">${ic("heart", 14, 2.2)}${p.hearts}</span>` : ""}
    ${opts.more ? `<span class="more" dir="ltr">+${opts.more}</span>` : ""}
    ${p.early && !opts.more ? `<span class="early">אליכם</span>` : ""}

function attachVenuePicker(input, cityInput) {
  const row = input.closest(".vp-row") || input.parentElement;
  const box = document.createElement("div"); box.className = "vp-list"; box.hidden = true; row.appendChild(box);
  input.setAttribute("autocomplete", "off"); input.setAttribute("role", "combobox"); input.setAttribute("aria-autocomplete", "list");
  let list = [], sel = -1, seq = 0;
  const draw = q => {
    box.innerHTML = list.map((v, i) => `<button type="button" class="vp-item ${i === sel ? "on" : ""}" data-i="${i}">
        <span class="vp-n">${esc(v.he)}${v.en && !vnorm(v.he).includes(vnorm(v.en)) ? `<span class="vp-en" dir="ltr">${esc(v.en)}</span>` : ""}</span>
        <span class="vp-c">${esc([v.city, v.type].filter(Boolean).join(" · "))}${v.custom ? " · נוסף על ידי משתמשים" : ""}</span></button>`).join("")
      + `<button type="button" class="vp-item vp-add" data-add="1">${ic("plus", 16)}<span>${list.length ? `לא ברשימה? להשתמש ב"${esc(q)}"` : `"${esc(q)}" לא ברשימה. להוסיף אותו`}</span></button>`;
    box.hidden = false;
  };
  const search = async () => {
    const q = input.value.trim(), my = ++seq;
    if (q.length < 2) { box.hidden = true; return; }
    const all = await loadVenues(); if (my !== seq) return;
    list = all.map(v => [vscore(q, v), v]).filter(x => x[0] >= 52).sort((a, b) => b[0] - a[0] || a[1].he.length - b[1].he.length).slice(0, 7).map(x => x[1]);
    sel = -1; draw(q);
  };
  const choose = v => {
    input.value = v.he; input.dataset.custom = "0";
    if (cityInput && v.city) cityInput.value = v.city;
    box.hidden = true;
  };
  let deb = 0;
  input.addEventListener("input", () => { input.dataset.custom = "1"; clearTimeout(deb); deb = setTimeout(search, 90); });
  input.addEventListener("focus", () => { loadVenues(); if (input.value.trim().length >= 2 && input.dataset.custom === "1") search(); });
  input.addEventListener("keydown", e => {
    if (box.hidden) return;
    if (e.key === "ArrowDown") { sel = Math.min(list.length - 1, sel + 1); draw(input.value.trim()); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(-1, sel - 1); draw(input.value.trim()); e.preventDefault(); }
    else if (e.key === "Enter" && sel >= 0) { choose(list[sel]); e.preventDefault(); }
    else if (e.key === "Escape") box.hidden = true;
  });
  box.addEventListener("pointerdown", e => e.preventDefault());
  box.addEventListener("click", e => {
    const b = e.target.closest(".vp-item"); if (!b) return;
    if (b.dataset.add) { input.dataset.custom = "1"; box.hidden = true; if (cityInput && !cityInput.value) cityInput.focus(); return; }
    choose(list[+b.dataset.i]);
  });
  input.addEventListener("blur", () => setTimeout(() => { box.hidden = true; }, 120));
}

/* teaser attach */
function attachSheet() {
  const ours = S.st.photos.filter(p => p.team === mySide() && p.vis !== "secret");
  const sel = new Set(S.draft.teaserPhotos);
  openSheet("תמונה לטיזר", ours.length ? `
    <p class="small muted" style="margin-bottom:12px">הצד השני יראה אותן מטושטשות עד החשיפה. עד 4 תמונות.</p>
    <div class="picker">${ours.map(p => `<button class="tile" data-pk="${esc(p.id)}" aria-pressed="${sel.has(p.id)}"><img src="${pub(p.thumb_path)}" alt="" loading="lazy"></button>`).join("")}</div>
    <button class="btn block" id="pk-ok" style="margin-top:14px">סיום</button>`
    : `<div class="empty"><h3>עוד אין תמונות שלכם</h3><p>העלו תמונה ואז צרפו אותה לטיזר.</p><button class="btn" data-act="pick" style="margin-top:14px">${ic("camera", 20)}העלאה</button></div>`, sh => {
    $$("[data-pk]", sh).forEach(b => b.onclick = () => {
      const id = b.dataset.pk;
      if (sel.has(id)) sel.delete(id); else if (sel.size < 4) sel.add(id); else return toast("עד 4 תמונות לטיזר", "album");
      b.setAttribute("aria-pressed", sel.has(id));
    });
    const ok = $("#pk-ok", sh); if (ok) ok.onclick = () => { S.draft.teaserPhotos = [...sel]; closeSheet(); render(); };
  });
}
async function sendTeaser() {
  const input = $("#tz-text"); const body = (input?.value || "").trim();
  const photos = S.draft.teaserPhotos.filter(id => photoById(id));
  if (!body && !photos.length) { input?.focus(); return; }
  if (input) input.value = "";
  const ok = await mutate(() => rpc("send_teaser", { p_token: S.token, p_body: body, p_photos: photos }));
  if (ok) { S.draft.teaserPhotos = []; toast(`נשלח ל${teamLabel(otherSide())}`, "send"); render(); }
  else if (input) input.value = body;
}

      const contacts = $("#st-c", sh).value.split("\n").map(l => l.split(/\s*[|,]\s*/)).filter(a => a[0] && a[0].trim()).slice(0, 30)
        .map(a => ({ name: a[0].trim().slice(0, 40), role: (a.length > 2 ? a[1] : "").trim().slice(0, 40), phone: (a.length > 2 ? a[2] : a[1] || "").trim().slice(0, 30) }));
      mutate(() => rpc("update_wedding", { p_token: S.token, p: { groom: $("#st-g", sh).value, bride: $("#st-b", sh).value, date: $("#st-d", sh).value || null, venue: $("#st-v", sh).value, venue_city: $("#st-vc", sh).value, venue_custom: $("#st-v", sh).dataset.custom === "1", contacts } }), "נשמר");
    };
    $$("[data-rr]", sh).forEach(b => b.onclick = () => { role = b.dataset.rr; $$("[data-rr]", sh).forEach(x => x.setAttribute("aria-pressed", x.dataset.rr === role)); });
    $("#st-me", sh).onclick = async () => { if (await mutate(() => rpc("update_me", { p_token: S.token, p_name: $("#st-nick", sh).value, p_role: role }), "נשמר")) closeSheet(); };
    const out = $("#st-out", sh);
    out.onclick = () => { if (!out.dataset.sure) { out.dataset.sure = 1; out.textContent = "בטוחים? תצטרכו את הקוד כדי לחזור"; return; } logout(); };
  });
}

/* backup: everything this person can see, zipped on the device */
let zipLib = null;
function loadZip() {
  if (!zipLib) zipLib = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    sc.onload = () => res(window.JSZip); sc.onerror = () => { zipLib = null; rej(new ApiError("network")); };
    document.head.appendChild(sc);
  });
  return zipLib;
}
async function backupZip(btn) {
  const label = btn.innerHTML;
  btn.disabled = true;
  try {
    const [JSZip, list] = await Promise.all([loadZip(), rpc("backup_manifest", { p_token: S.token })]);
    if (!list || !list.length) { toast("עוד אין מה לגבות", "album"); return; }
    const zip = new JSZip(), meta = [];
    let done = 0, failed = 0, i = 0;
    const stamp = t => { const d = new Date(t); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`; };
    const worker = async () => {
      while (i < list.length) {
        const it = list[i++], url = pub(it.path);
        try {
          const r = await fetch(url); if (!r.ok) throw 0;
          const ext = it.path.split(".").pop();
          const name = `${it.team === "groom" ? "חבורת-החתן" : "חבורת-הכלה"}/${stamp(it.at)}-${it.id.slice(0, 6)}.${ext}`;
          zip.file(name, await r.blob(), { binary: true });
          meta.push({ file: name, caption: it.caption, by: it.by, at: it.at, kind: it.kind });
        } catch { failed++; }
        done++;
        btn.textContent = `מכינים גיבוי ${done} מתוך ${list.length}…`;
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    zip.file("פרטים.json", JSON.stringify({ wedding: `${W().groom} ו${W().bride}`, date: W().date, items: meta }, null, 2));
    btn.textContent = "אורזים…";
    const blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `שני-צדדים-${W().date}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast(failed ? `הגיבוי ירד. ${failed} קבצים לא הורדו, נסו שוב` : `הגיבוי ירד: ${list.length - failed} קבצים`, failed ? "x" : "check");
  } catch (e) { toast(ERR[e.code] || "הגיבוי לא הצליח. נסו שוב", "x"); }
  finally { btn.disabled = false; btn.innerHTML = label; }
}

/* reveal moment */
function showRevealOverlay() {
  const key = "seenReveal." + (W().revealed_at || W().reveal_at);
  if ($(".reveal-ov") || store.get(key, false)) return;
  store.set(key, true);
  const total = sharedList().length;
  const ov = document.createElement("div");
  ov.className = "reveal-ov"; ov.dir = "rtl";
  ov.innerHTML = `${ringsSvg(0)}<h2>מזל טוב!</h2>
    <p class="lede">${esc(coupleName("groom"))} ו${esc(coupleName("bride"))} נפגשו, וגם האלבומים. ${total} תמונות משני הצדדים פתוחות עכשיו לכולם.</p>
    <button class="btn gold" id="rv-go">${ic("album", 20)}לאלבום המשותף</button>`;
  document.body.appendChild(ov);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $$("[data-ring='g']", ov).forEach(c => c.setAttribute("cx", 124));
    $$("[data-ring='b']", ov).forEach(c => c.setAttribute("cx", 96));
    $$("[data-gem]", ov).forEach(g => g.style.transform = "translateX(-14px)");
  }));
  confetti();
  $("#rv-go", ov).onclick = () => { ov.remove(); S.albumTab = "shared"; if (location.hash === "#album") render(true); else location.hash = "album"; };
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c);
  const x = c.getContext("2d"), dpr = Math.min(2, devicePixelRatio || 1);
  const Wd = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--gold", "--groom", "--bride"].map(v => cs.getPropertyValue(v).trim() || "#c9a24a");
  const ps = Array.from({ length: 150 }, () => ({ x: Wd / 2 + (Math.random() - .5) * Wd * .3, y: H * .42, vx: (Math.random() - .5) * 18 * dpr, vy: (-Math.random() * 16 - 6) * dpr, r: (3 + Math.random() * 4) * dpr, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * 3)] }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, Wd, H);
    for (const p of ps) { p.vy += .45 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(f); else c.remove();
  })(t0);
}

/* ============ global clicks ============ */
document.addEventListener("click", async e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { if (nav.dataset.tab) S.albumTab = nav.dataset.tab; if (location.hash === "#" + nav.dataset.nav) render(true); else location.hash = nav.dataset.nav; return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const k = a.dataset.act, id = a.dataset.id;
  switch (k) {
    case "go-join": return renderJoin();
    case "go-create": return renderCreate();
    case "go-landing": return renderLanding();
    case "pick": closeSheet(); return pick();
    case "invite": return inviteSheet(false);
    case "settings": return settingsSheet(a.dataset.focus);
    case "album-tab": S.albumTab = a.dataset.tab; return render();
    case "sched-filter": S.schedFilter = a.dataset.f; return render();
    case "task-filter": S.taskFilter = a.dataset.f; return render();
    case "photo": return openLightbox(id);
    case "add-sched": return schedSheet(null);
    case "edit-sched": return schedSheet(S.st.sched.find(s => s.id === id));
    case "add-task": return taskSheet(null);
    case "edit-task": return taskSheet(S.st.tasks.find(t => t.id === id));
    case "toggle-task": {
      const t = S.st.tasks.find(x => x.id === id); if (!t) return;
      if (!t.done && t.mission) return pick(id);
      return mutate(() => rpc("toggle_task", { p_token: S.token, p_id: id }), t.done ? null : `+${Number(t.pts) || 0} ל${teamLabel(mySide())}`);
    }
    case "claim": return mutate(() => rpc("claim_task", { p_token: S.token, p_id: id }));
    case "mission": return pick(id);
    case "tz-chip": { const i = $("#tz-text"); if (i) { i.value = a.textContent; i.focus(); } return; }
    case "tz-attach": return attachSheet();
    case "tz-send": return sendTeaser();
    case "react": return mutate(() => rpc("react", { p_token: S.token, p_teaser: id, p_emoji: a.dataset.e }));
    case "write-letter": return writeLetterSheet();
    case "letter": { const l = S.st.letters.find(x => x.id === id); if (l) letterSheet(l); return; }
    case "ai-go": return aiGo(a.dataset.kind);
    case "status": return statusSheet();
    case "slideshow": return slideshow();
    case "recap": return recapSheet();
    case "cover": closeSheet(); return coverSheet();
    case "cover-hide": store.set("cover.hide." + W().id, true); return render();
    case "cover-sug": return useAsCover(photoById(id));
    case "cover-sug-hide": store.set("cover.sug." + W().id, true); return render();
    case "push-on": closeSheet(); return enablePush();
    case "push-off": closeSheet(); return disablePush();
    case "push-hide": store.set("push.hide", true); return render();
  }
});
window.addEventListener("hashchange", () => {
  if (location.hash === "#recap") { history.replaceState(null, "", "#home"); if (S.st) { setView("home"); if (RECAP_JOB) recapSheet(); } return; }
  if (S.st) setView(isGuest() && !GUEST_VIEWS.includes(location.hash.slice(1)) ? "home" : location.hash.slice(1)); });

/* ============ boot ============ */
(async function boot() {
  const qCode = new URLSearchParams(location.search).get("code");
  const h = location.hash.slice(1); if (VIEWS.includes(h)) S.view = h;
  if (S.token) {
    await refresh();
    if (S.st) {
      startLoop();
      registerSW();
      if (qCode && qCode.toUpperCase().replace(/[^A-Z0-9]/g, "") !== W().my_code) toast("אתם כבר מחוברים לחתונה. כדי להצטרף עם קוד אחר, צאו מההגדרות", "user");
      history.replaceState(null, "", location.pathname + location.hash);
      if (isRevealed()) setTimeout(showRevealOverlay, 500);
      return;
    }
    if (!S.token) { /* logged out by bad token */ }
    else { bare(`<div class="loading"><div>${ringsSvg(0)}<p class="big-title" style="font-size:28px;margin-top:8px">אין חיבור כרגע</p><p class="lede" style="margin-top:6px">בדקו את האינטרנט. ננסה שוב בעוד כמה שניות.</p></div></div>`); setTimeout(() => location.reload(), 5000); return; }
  }
  if (qCode) renderJoin(qCode.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6));
  else renderLanding();
})();
})();
